# .github/workflows/d2.yml
# D2 diagram quality gate — `d2 validate` + `d2 fmt --check` on every .d2 change.
# d2 CLI pinned to v0.9.0 (linux-amd64 release tarball, SHA256-verified).
# Note: `d2 fmt -c` is `--center` (mutates files) — only `d2 fmt --check` gates formatting.
name: d2

on:
  push:
    branches: [main, develop]
    paths:
      - '**/*.d2'
      - '.github/workflows/d2.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.d2'
      - '.github/workflows/d2.yml'

permissions:
  contents: read

concurrency:
  group: d2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  D2_VERSION: v0.9.0
  # sha256 of d2-v0.9.0-linux-amd64.tar.gz (release asset SHA256SUMS)
  D2_TARBALL_SHA256: 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9

jobs:
  d2:
    name: d2 validate + fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install d2 ${{ env.D2_VERSION }}
        run: |
          set -euo pipefail
          tarball="d2-${D2_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/${tarball}"
          echo "${D2_TARBALL_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}"
          # tarball extracts to d2-<version>/
          install -D -m 0755 "${RUNNER_TEMP}/d2-${D2_VERSION}/bin/d2" "${HOME}/.local/bin/d2"
          if [ -n "${GITHUB_PATH:-}" ]; then
            echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          fi
          "${HOME}/.local/bin/d2" --version

      - name: Collect .d2 files
        run: |
          set -euo pipefail
          git ls-files '*.d2' | tee "${RUNNER_TEMP}/d2-files.txt"

      - name: d2 validate
        run: |
          set -euo pipefail
          if [ ! -s "${RUNNER_TEMP}/d2-files.txt" ]; then
            echo "No tracked .d2 files — skipping validate."
            exit 0
          fi
          # -r: do nothing on an empty list; non-zero (123) if any file fails validation
          xargs -r -n1 d2 validate < "${RUNNER_TEMP}/d2-files.txt"

      - name: d2 fmt --check
        run: |
          set -euo pipefail
          if [ ! -s "${RUNNER_TEMP}/d2-files.txt" ]; then
            echo "No tracked .d2 files — skipping format check."
            exit 0
          fi
          # NOT `d2 fmt -c`: -c is --center and rewrites files instead of checking
          xargs -r d2 fmt --check < "${RUNNER_TEMP}/d2-files.txt"
